name: vocab_ai
description: "Vocab AI - Ung dung hoc tu vung da ngon ngu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^14.2.0
  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  # HTTP
  dio: ^5.4.3
  # TTS
  flutter_tts: ^4.0.2
  # Audio playback (MP3)
  just_audio: ^0.9.40
  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  # Secure storage
  flutter_secure_storage: ^9.2.2
  # Home widget
  home_widget: ^0.5.0
  # Shared prefs (non-sensitive settings)
  shared_preferences: ^2.3.2
  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
